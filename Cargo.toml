[workspace]
members = [
    "crates/libs/catalog",
    "crates/libs/common",
    "crates/libs/configuration",
    "crates/libs/data",
    "crates/services/server",
    "crates/tools/cli",
]
resolver = "2"

[workspace.package]
authors         = ["CarloMicieli <piovarolo@gmail.com>"]
documentation   = "https://github.com/CarloMicieli/trenako"
edition         = "2024"
homepage        = "https://github.com/CarloMicieli/trenako"
license         = "Apache-2.0"
readme          = "README.md"
repository      = "https://github.com/CarloMicieli/trenako"
rust-version    = "1.92"
version         = "0.1.0"

[workspace.dependencies]
anyhow              = "1.0.102"
async-trait         = "0.1.89"
axum                = "0.8.9"
axum-macros         = "0.5.1"
chrono              = { version = "0.4.44", features = ["serde"] }
clap                = { version = "4.6.1", features = ["derive"] }
config              = { version = "0.15.22", default-features = false, features = ["yaml"] }
csv                 = "1.4.0"
testcontainers      = "0.27.3"
handlebars          = "6.4.0"
http                = "1.4.0"
http-body-util      = "0.1.3"
hyper               = { version = "1.9.0", features = ["http1", "server"] }
isocountry          = "0.3.2"
itertools           = "0.14.0"
jsonschema          = "0.38.1"
lazy_static         = "1.5.0"
mime                = "0.3.17"
pretty_assertions   = "1.4.1"
rand                = "0.9.4"
regex               = "1.12.3"
reqwest             = { version = "0.13.2", features = ["json"] }
rstest              = "0.26.1"
rust_decimal        = { version = "1.41.0", features = ["serde-with-float"] }
rust_decimal_macros = "1.40.0"
secrecy             = { version = "0.10.3", features = ["serde"] }
serde               = { version = "1.0.228", features = ["derive"] }
serde_derive        = "1.0.228"
serde_json          = "1.0.149"
serde_urlencoded    = "0.7.1"
slug                = "0.1.6"
strum               = "0.27.2"
strum_macros        = "0.27.2"
thiserror           = "2.0.18"
tokio               = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tower               = { version = "0.5.3", features = ["limit", "timeout"] }
tower-http          = { version = "0.6.8", features = ["compression-gzip", "propagate-header", "request-id", "trace"] }
tracing             = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber  = { version = "0.3.23", features = ["env-filter", "fmt", "json", "registry", "std"] }
url                 = { version = "2.5.8", features = ["serde"] }
uuid                = { version = "1.23.1", features = ["serde", "v4"] }
validator           = { version = "0.20.0", features = ["derive"] }
walkdir             = "2.5.0"

[workspace.dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "chrono",
    "rust_decimal",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio-rustls",
    "uuid"
]

[workspace.dependencies.fake]
version = "4.4.0"
default-features = false
features = [
    "chrono",
    "rust_decimal",
    "uuid"
]

[profile.dev.package.sqlx-macros]
opt-level = 3
